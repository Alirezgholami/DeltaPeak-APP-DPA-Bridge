services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DPA_POSTGRES_DB:-dpa}
      POSTGRES_USER: ${DPA_POSTGRES_USER:-dpa}
      POSTGRES_PASSWORD: ${DPA_POSTGRES_PASSWORD:?Set DPA_POSTGRES_PASSWORD}
    volumes:
      - dpa_pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DPA_POSTGRES_USER:-dpa} -d ${DPA_POSTGRES_DB:-dpa}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      DPA_ENV: production
      DPA_DATABASE_URL: postgresql+psycopg://${DPA_POSTGRES_USER:-dpa}:${DPA_POSTGRES_PASSWORD}@postgres:5432/${DPA_POSTGRES_DB:-dpa}
      DPA_JWT_SECRET: ${DPA_JWT_SECRET:?Set DPA_JWT_SECRET}
      DPA_OTP_PEPPER: ${DPA_OTP_PEPPER:?Set DPA_OTP_PEPPER}
      DPA_JWT_ISSUER: ${DPA_JWT_ISSUER:-dpa-backend}
      DPA_ACCESS_TOKEN_MINUTES: ${DPA_ACCESS_TOKEN_MINUTES:-30}
      DPA_REFRESH_TOKEN_DAYS: ${DPA_REFRESH_TOKEN_DAYS:-30}
      DPA_OTP_EXPIRE_SECONDS: ${DPA_OTP_EXPIRE_SECONDS:-120}
      DPA_OTP_RESEND_SECONDS: ${DPA_OTP_RESEND_SECONDS:-60}
      DPA_OTP_MAX_ATTEMPTS: ${DPA_OTP_MAX_ATTEMPTS:-5}
      DPA_OTP_MOBILE_HOUR_LIMIT: ${DPA_OTP_MOBILE_HOUR_LIMIT:-6}
      DPA_OTP_IP_HOUR_LIMIT: ${DPA_OTP_IP_HOUR_LIMIT:-30}
      DPA_LOGIN_WINDOW_SECONDS: ${DPA_LOGIN_WINDOW_SECONDS:-900}
      DPA_LOGIN_MOBILE_MAX_FAILURES: ${DPA_LOGIN_MOBILE_MAX_FAILURES:-5}
      DPA_LOGIN_IP_MAX_FAILURES: ${DPA_LOGIN_IP_MAX_FAILURES:-25}
      DPA_SMS_PROVIDER: ${DPA_SMS_PROVIDER:-kavenegar}
      DPA_SMS_WEBHOOK_URL: ${DPA_SMS_WEBHOOK_URL:-}
      DPA_SMS_WEBHOOK_TOKEN: ${DPA_SMS_WEBHOOK_TOKEN:-}
      DPA_SMS_SIGNUP_TEMPLATE: ${DPA_SMS_SIGNUP_TEMPLATE:-DPA_SIGNUP}
      DPA_SMS_RESET_TEMPLATE: ${DPA_SMS_RESET_TEMPLATE:-DPA_RESET}
      DPA_KAVENEGAR_API_KEY: ${DPA_KAVENEGAR_API_KEY:-}
      DPA_KAVENEGAR_TEMPLATE: ${DPA_KAVENEGAR_TEMPLATE:-}
      DPA_KAVENEGAR_SIGNUP_TEMPLATE: ${DPA_KAVENEGAR_SIGNUP_TEMPLATE:-}
      DPA_KAVENEGAR_RESET_TEMPLATE: ${DPA_KAVENEGAR_RESET_TEMPLATE:-}
      DPA_FORWARDED_ALLOW_IPS: ${DPA_FORWARDED_ALLOW_IPS:-*}
    networks: [backend, edge]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      DPA_API_DOMAIN: ${DPA_API_DOMAIN:?Set DPA_API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - dpa_caddy_data:/data
      - dpa_caddy_config:/config
    networks: [edge]

volumes:
  dpa_pgdata:
  dpa_caddy_data:
  dpa_caddy_config:

networks:
  backend:
    internal: true
  edge:
